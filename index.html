<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facility Management System</title>

    <!--Bootstrap CSS-->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <!--Custom CSS-->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <aside class="sidebar col-md-2 bg-dark text-white min-vh-100 p-3">
          <h4 class="mb-4 text-white">FacilityMS</h4>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link active"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link"
                >Facilities</a
              >
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link">Assets</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link"
                >Maintenance</a
              >
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link"
                >Work Orders</a
              >
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white sidebar-link">Users</a>
            </li>
          </ul>
        </aside>

        <main class="main-content col-md-10 p-0">
          <nav
            class="topbar navbar bg-white border-bottom px-4 py-3 justify-content-between"
          >
            <div class="d-flex align-items-center gap-3">
              <button
                id="sidebarToggle"
                class="btn btn-outline-secondary d-md-none"
                type="button"
                aria-label="Toggle sidebar"
                aria-expanded="false"
              >
                ☰
              </button>
              <span class="navbar-brand mb-0 h1 page-title">Dashboard</span>
            </div>
            <div class="d-flex align-items-center gap-3">
              <div class="text-end">
                <p class="mb-0 fw-semibold">Administrator</p>
                <small class="text-muted">Facility Manager</small>
              </div>
              <div
                class="user-avatar d-flex align-items-center justify-content-center rounded-circle bg-primary text-white fw-bold"
              >
                AD
              </div>
            </div>
          </nav>

          <section class="p-4">
            <h2 class="content-title">Dashboard</h2>

            <p class="text-muted">
              Overview of your facility management system
            </p>
            <section class="dashborad">
              <!-- Dashboard summary cards-->
              <section class="dashboard-summary">
                <div class="row g-3">
                  <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card dashboard-stat-card h-100">
                      <div
                        class="card-body d-flex justify-content-between align-items-center"
                      >
                        <div>
                          <p class="text-muted mb-2">Total Facilities</p>
                          <h3 class="dashboard-stat-value mb-0">8</h3>
                        </div>
                        <div class="dashboard-stat-icon">
                          <i class="bi bi-building"></i>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card dashboard-stat-card h-100">
                      <div
                        class="card-body d-flex justify-content-between align-items-center"
                      >
                        <div class="card-body">
                          <p class="text-muted mb-2">Open Requests</p>
                          <h3 class="dashboard-stat-value mb-0">12</h3>
                        </div>
                        <div class="dashboard-stat-icon">
                          <i class="bi bi-tools"></i>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card dashboard-stat-card h-100">
                      <div
                        class="card-body d-flex justify-content-between align-items-center"
                      >
                        <div class="card-body">
                          <p class="text-muted mb-2">Available Spaces</p>
                          <h3 class="dashboard-stat-value mb-0">24</h3>
                        </div>
                        <div class="dashboard-stat-icon">
                          <i class="bi bi-door-open"></i>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-sm-6 col-xl-3">
                    <div class="card dashboard-stat-card h-100">
                      <div
                        class="card-body d-flex justify-content-between align-items-center"
                      >
                        <div class="card-body">
                          <p class="text-muted mb-2">Active Assets</p>
                          <h3 class="dashboard-stat-value mb-0">156</h3>
                        </div>
                        <div class="dashboard-stat-icon">
                          <i class="bi bi-box-seam"></i>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <!-- Recent maintenance requests-->
              <section class="dashboard-maintenance"></section>

              <!-- Facility overview-->
              <section class="dashboard-facilities"></section>

              <!-- Recent activity-->
              <section class="dashboard-activity"></section>
            </section>
          </section>
        </main>
      </div>
    </div>

    <!--jQuery-->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!--Bootstrap JavaScript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!--Vanilla JavaScript-->
    <script src="./js/app.js"></script>

    <!--jQuery code-->
    <script src="./js/jquery-app.js"></script>
  </body>
</html>
